<script>
  // Micro-interaction for smooth splash progression feedback
  const continueBtn = document.getElementById('splash-continue-btn');
  if (continueBtn) {
    continueBtn.addEventListener('click', function() {
      this.classList.add('opacity-75');
      this.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px] mr-2">progress_activity</span> Connexion en cours...';
      setTimeout(() => {
        this.innerHTML = '<span class="material-symbols-outlined text-[18px] mr-2">check_circle</span> Bienvenue à bord!';
      }, 700);
    });
  }
